[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnforge-mvp"
version = "0.2.0"
description = "GitHub App commit security and dependency vulnerability agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.9,<3",
  "packaging>=24,<27",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["vulnforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
vulnforge = ["dashboard.html"]
