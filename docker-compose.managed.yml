# Explicit owner-consented managed scanning, layered over the private defaults:
# docker compose -f docker-compose.yml -f docker-compose.managed.yml up --build -d
services:
  api:
    environment:
      SCAN_MODE: managed
      ALLOW_MANAGED_SOURCE_ACCESS: ${ALLOW_MANAGED_SOURCE_ACCESS:?Explicit source access approval is required}
      MANAGED_SCAN_CONSENT_ID: ${MANAGED_SCAN_CONSENT_ID:?A consent reference is required}
      CUSTOMER_API_PREVIEW: "false"
      GITHUB_CONNECTION_PREVIEW: "false"
      RUNNER_OIDC_PREVIEW: "false"
  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "vulnforge.worker"]
    env_file: .env
    environment:
      DATABASE_PATH: /data/vulnforge.db
      SCAN_MODE: managed
      ALLOW_MANAGED_SOURCE_ACCESS: ${ALLOW_MANAGED_SOURCE_ACCESS:?Explicit source access approval is required}
      MANAGED_SCAN_CONSENT_ID: ${MANAGED_SCAN_CONSENT_ID:?A consent reference is required}
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_app_key
      GITHUB_OAUTH_CLIENT_ID: ""
      GITHUB_OAUTH_CLIENT_SECRET: ""
      PUBLIC_ORIGIN: ""
      CUSTOMER_DATABASE_URL: ""
      CUSTOMER_API_PREVIEW: "false"
      GITHUB_CONNECTION_PREVIEW: "false"
      RUNNER_OIDC_PREVIEW: "false"
      RUNNER_TRUSTED_WORKFLOWS: ""
      ADMIN_TOKEN: ""
      OPERATOR_CREDENTIALS: "{}"
      OPERATOR_REPORT_TOKEN: ""
      WEBHOOK_SECRET: ""
    volumes:
      - vulnforge_data:/data
      - ./private-key.pem:/run/secrets/github_app_key:ro
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
