# Scheduled full-inventory audit profile for a dedicated customer runner.
# Copy to .github/workflows/vulnforge-scheduled.yml; set the scanner path and immutable Action ref.
name: VulnForge scheduled audit
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vulnforge-scheduled-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    runs-on: [self-hosted, linux, vulnforge]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # verified v4.2.2
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 1
      - id: scan
        uses: OWNER/VulnForge@COMMIT_SHA
        with:
          scanner-python: /opt/vulnforge/bin/python
          commit-sha: ${{ github.sha }}
          profile: scheduled
          require-complete: 'true'
      - if: always() && steps.scan.outputs.code-report != ''
        env:
          VF_REPORT: ${{ steps.scan.outputs.code-report }}
        run: /opt/vulnforge/bin/python -I -m vulnforge.runner_cleanup --report "$VF_REPORT" --runner-temp "$RUNNER_TEMP"

