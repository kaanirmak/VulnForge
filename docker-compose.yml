services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/vulnforge.db
      SCAN_MODE: customer_runner
      ALLOW_MANAGED_SOURCE_ACCESS: "false"
      GITHUB_PRIVATE_KEY_PATH: ""
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - vulnforge_data:/data
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
volumes:
  vulnforge_data:
