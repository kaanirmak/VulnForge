<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VulnForge / Security Console</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,sans-serif;background:#0a101c;color:#dfe9f8}
*{box-sizing:border-box}body{margin:0;line-height:1.5}.shell{max-width:1180px;padding:48px 24px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;margin-bottom:36px}
.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.brand em{font-style:normal;color:#42d4ad}
.sub{color:#92a5ba;font-size:13px}input,button{border:1px solid #2a3a50;border-radius:10px;padding:11px 14px;color:#e9f4fa;background:#141e2e;font-size:14px}
input{width:240px}button{cursor:pointer;background:#1d5d52;border-color:#288473;font-weight:600}button:hover{background:#28766b}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:30px}.stat{background:#101b2c;border:1px solid #243449;padding:20px;border-radius:15px}
.num{font-size:37px;font-weight:750;margin:8px 0 0}.section{margin-top:25px}.section h2{font-size:18px;font-weight:650}
table{border-collapse:collapse;width:100%;background:#101b2c;border-radius:12px;overflow:hidden}th,td{padding:13px 15px;text-align:left;border-bottom:1px solid #243449;font-size:13px;vertical-align:top;word-break:break-word}
th{color:#9db4ce;text-transform:uppercase;font-size:11px;letter-spacing:1px}td{max-width:450px}tbody tr:last-child td{border-bottom:0}
.pill{padding:3px 9px;background:#29454b;border-radius:20px;color:#91f5dc;font-size:12px}.warn{background:#4a372c;color:#f4b98c}.failure{color:#e8a6a6}
a{color:#79d7d2}#message{min-height:22px;color:#e6ba8f;margin-bottom:14px}@media(max-width:650px){.stats{grid-template-columns:1fr}input{width:100%}}
</style></head>
<body><div class="shell">
<header><div><div class="brand">⬡ Vuln<em>Forge</em></div><div class="sub">Autonomous Security Monitor · MVP 0.2.0</div></div>
<div><input id="token" type="password" placeholder="Admin token (not saved)" autocomplete="off"> <button onclick="load()">Refresh</button></div></header>
<div id="message">Admin token girip Refresh'e bas.</div>
<div class="stats"><div class="stat"><div class="sub">Repositories</div><div id="repos_n" class="num">—</div></div><div class="stat"><div class="sub">Open Findings</div><div id="finds_n" class="num">—</div></div><div class="stat"><div class="sub">Draft Remediations</div><div id="prs_n" class="num">—</div></div></div>
<div class="section"><h2>Security Findings</h2><div id="findings"></div></div>
<div class="section"><h2>Recent Jobs</h2><div id="jobs"></div></div>
<div class="section"><h2>Repositories</h2><div id="repos"></div></div>
<div class="sub" style="margin-top:36px">No repository source code is executed by this MVP. Auto-merge disabled.</div>
</div><script>
let token='';
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function table(el,heads,rows){let html='<table><thead><tr>'+heads.map(h=>'<th>'+safe(h)+'</th>').join('')+'</tr></thead><tbody>';
html+=rows.length?rows.map(r=>'<tr>'+r.map(c=>'<td>'+safe(c)+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+heads.length+'">No data yet</td></tr>';
document.getElementById(el).innerHTML=html+'</tbody></table>';}
async function get(path){let r=await fetch(path,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('HTTP '+r.status+' '+path);return r.json();}
async function load(){token=document.getElementById('token').value;document.getElementById('message').textContent='';try{
let [repos,findings,jobs,prs]=await Promise.all(['/api/repositories','/api/findings','/api/jobs','/api/remediations'].map(get));
document.getElementById('repos_n').textContent=repos.length;document.getElementById('finds_n').textContent=findings.filter(x=>x.status==='open').length;document.getElementById('prs_n').textContent=prs.length;
table('findings',['Repository','Severity','Title','Path','State'],findings.map(f=>[f.repo,f.severity.toUpperCase(),f.title,f.file_path,f.status]));
table('jobs',['ID','Repository','Task','State','Attempts'],jobs.slice(0,30).map(j=>[j.id,j.repo,j.kind,j.state,j.attempts]));
table('repos',['Repository','Default branch','Installation','Updated'],repos.map(r=>[r.full_name,r.default_branch,r.installation_id,new Date(r.updated_at*1000).toLocaleString()]));
}catch(e){document.getElementById('message').textContent='Cannot load: '+e.message;}}
</script></body></html>
